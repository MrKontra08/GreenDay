 <div class="hintline"><b>Глибина.</b> Для 24 найцікавіших напрямів — реальна рутина, а далі вимушені вибори між фаворитами.</div>
 <div class="hintline"><b>Відокремлюємо здібності.</b> Те, що ти поки нічого не вмієш, не робить напрям непридатним для розвитку.</div>
 <div class="hintline"><b>Без підглядання.</b> Рейтинг з’явиться лише наприкінці; всі відповіді залишаться у твоєму браузері.</div>
 <div class="controls">${actionButton('Почати 132 запитання','start')}${unfinished?actionButton('Продовжити збережений тест','resume','secondary'):''}</div>
 <p class="fine"><strong>Важливо:</strong> жоден самозвітний тест не можна зробити невразливим до свідомого підлаштування. Результат — авторський індекс 0–100%, а не ймовірність успіху чи сертифікована оцінка здібностей. Орієнтир: дослідження професійних інтересів RIASEC, але це не офіційний тест O*NET.</p></section>`;}
function chapter(){let st=stageLabel();let copy=st.id==='screen'?'Рекомендується відповідати швидко, але без поспіху. Не зациклюйся на тому, чи зміг би ти це зараз зробити.':st.id==='friction'?'Найяскравіше захоплення іноді зникає, коли бачиш його звичайний робочий день. Саме це ми перевіримо.':st.id==='duel'?'Дві рівноцінні пропозиції, жодного «і те, і те». Тільки власна перевага.':st.id==='ready'?'Знання та досвід фіксуються окремо від твоєї цікавості — вони не знецінюють новий шлях.':st.id==='values'?'Вісім безоцінних компромісів — як ти хочеш жити й працювати, а не ким вважати себе.':'Майже все. Різниця у відповідях — це сигнал непевності, не доказ нещирості.';
 app.innerHTML=`<section class="panel chapter"><div class="eyebrow">Етап ${state.stage+1} із 6</div><div class="chapter count">${String(state.stage+1).padStart(2,'0')}</div><h2>${escapeHtml(st.name)}</h2><div class="pill">${escapeHtml(st.descr)}</div><p>${escapeHtml(st.intro)}</p><div class="chapter-note">${escapeHtml(copy)}</div><div class="controls">${actionButton('До запитань','enter')}</div><p class="fine">Пройдено ${progress()} із ${fullProgress()} відповідей. Прогрес зберігається автоматично.</p></section>`;}
function question(){let st=stageLabel(),item=state.orders[st.id][state.pos],prompt='',topic='',options=[],instruction='';
 if(st.id==='screen'){let o=t(item);topic=o.family;prompt=o.task;instruction='Наскільки тобі хотілося б це робити?';options=st.scale.map((x,i)=>({value:i+1,label:x}));}
 if(st.id==='friction'){let o=t(item);topic=o.name;prompt=o.hard;instruction='Як часто ти готовий миритися з такою роботою?';options=st.scale.map((x,i)=>({value:i+1,label:x}));}
 if(st.id==='ready'){let o=t(item);topic=o.name;prompt=o.skill;instruction='Наскільки ти вже готовий це робити?';options=st.scale.map((x,i)=>({value:i+1,label:x}));}
 if(st.id==='retest'){let o=t(item);topic=o.family;prompt=o.task;instruction='Повторне оцінювання тієї самої активності';options=st.scale.map((x,i)=>({value:i+1,label:x}));}
 if(st.id==='duel'){let [a,b]=item;topic='Дилема №'+(state.pos+1);prompt='Тиждень роботи: що обереш?';instruction='Зарплата, престиж і тривалість — однакові.';options=[{value:a,label:t(a).task},{value:b,label:t(b).task}]}
 if(st.id==='values'){let o=VALUES[item];topic='Робочі умови';prompt='Який варіант тобі ближчий?';instruction='Обидва мають свої переваги.';options=[{value:'a',label:o.a},{value:'b',label:o.b}]}
 let cur=st.id==='duel'?state.answers.duel[String(state.pos)]:st.id==='values'?state.answers.values[String(item)]:state.answers[st.id][item];
 app.innerHTML=`<section class="question-box"><div class="topline"><span><b>${escapeHtml(st.name)}</b> · ${state.pos+1}/${st.n}</span><span>${progress()+1} / ${fullProgress()}</span></div><div class="progress-line"><div class="progress-fill" style="width:${100*progress()/fullProgress()}%"></div></div>
 <div class="panel" style="margin-top:26px"><div class="eyebrow">${escapeHtml(instruction)}</div><div class="qtopic">${escapeHtml(topic)}</div><h1 class="qtitle">${escapeHtml(prompt)}</h1><p class="qintro">${st.id==='screen'||st.id==='retest'?'Не думай, чи є в тебе диплом або досвід.':st.id==='friction'?'Зверни увагу саме на звичайну, не романтизовану частину роботи.':st.id==='ready'?'Будь реалістичним: тут оцінюємо досвід, не потенціал.':'Вибери варіант, якому віддав би час.'}</p>
 <div class="choices">${options.map((o,i)=>`<button type="button" class="choice ${String(cur)===String(o.value)?'checked':''} ${options.length===2?'two':''}" data-choice="${escapeHtml(String(o.value))}"><span class="num">${options.length===2?i===0?'A':'Б':i+1}</span><span class="label">${escapeHtml(o.label)}</span></button>`).join('')}</div><div class="endrow"><button class="back" data-act="back" ${state.pos===0?'disabled':''}>← Попереднє питання</button><span class="passive">Відповідь зберігається автоматично</span></div></div></section>`;
}
function computeScores(){const entries=(state.orders.friction||[]);const wins={},played={};let pairs=state.orders.duel||[];
 for(let i=0;i<pairs.length;i++){let p=pairs[i],ans=state.answers.duel[String(i)];if(ans!==undefined){for(let id of p)played[id]=(played[id]||0)+1;wins[ans]=(wins[ans]||0)+1;}}
 return entries.map(id=>{const a=25*(rate(id)-1),h=25*(harder(id)-1);const n=played[id]||0;const d=n?100*((wins[id]||0)+1)/(n+2):50;
 let echo=state.answers.retest[id];const interest=(echo!==undefined?(a+25*(Number(echo)-1))/2:a);
 let score=Math.round(.47*interest+.35*h+.18*d);
 return{id,score,interest:Math.round(interest),hard:h,duel:Math.round(d),readiness:state.answers.ready[id]!==undefined?state.answers.ready[id]:null,n};
 }).sort((a,b)=>b.score-a.score||b.hard-a.hard||b.interest-a.interest||a.id.localeCompare(b.id));}
function riasec(){let sums={R:0,I:0,A:0,S:0,E:0,C:0},cnt={R:0,I:0,A:0,S:0,E:0,C:0};for(let o of TOPICS){let v=25*(rate(o.id)-1);for(let i=0;i<o.codes.length;i++){let w=i===0?1:.45;sums[o.codes[i]]+=v*w;cnt[o.codes[i]]+=w;}}
 return Object.keys(sums).map(k=>({key:k,label:RIA[k],v:Math.round(sums[k]/cnt[k])})).sort((a,b)=>b.v-a.v)}
function consistency(){let list=state.orders.retest||[],diffs=list.filter(id=>state.answers.retest[id]!=null).map(id=>Math.abs(Number(state.answers.retest[id])-rate(id)));if(!diffs.length)return null;
 let c=Math.round(100*(1-diffs.reduce((a,b)=>a+b,0)/(diffs.length*4)));let spread=new Set(Object.values(state.answers.screen)).size;return {percent:c,range:spread,high:diffs.filter(x=>x>=3).length};}
function scoresMarkup(){const scores=computeScores(),profiles=riasec(),cons=consistency(),selected=VALUES.map((x,i)=>{let v=state.answers.values[String(i)];return v==='a'?x.tag[0]:v==='b'?x.tag[1]:null}).filter(Boolean);
 let options=scores.slice(0,10).map((x,i)=>{let o=t(x.id);let readiness=x.readiness===null?'Не оцінювалась у фінальному блоці':(['','Початківець','Маю уявлення','Можу з підтримкою','Можу самостійно','Можу пояснювати'][Number(x.readiness)]||'Не оцінено');let style= x.readiness!==null&&x.readiness<=2?'Новий напрям для проби':x.readiness>=4?'Можна поглиблювати':'Потенціал для розвитку';
 return `<article class="rank"><header><div class="idx">${String(i+1).padStart(2,'0')}</div><div><h3>${escapeHtml(o.name)}</h3><small>${escapeHtml(o.family)} · ${escapeHtml(style)}</small></div><div class="pct">${x.score}<span>%</span></div></header><div class="bar"><div style="width:${x.score}%"></div></div><details ${i===0?'open':''}><summary>Розібрати результат і спробувати на практиці</summary><div class="details-inner"><p><strong>Цікавість:</strong> ${x.interest}/100 · <strong>Готовність до рутини:</strong> ${x.hard}/100 · <strong>Перевага в дилемах:</strong> ${x.duel}/100 (${x.n} порівнянь).</p><p><strong>Поточна підготовка:</strong> ${escapeHtml(readiness)}. Вона не входить до відсотка відповідності.</p><p><strong>Експеримент на 7 днів:</strong> ${escapeHtml(o.trial)}</p></div></details></article>`}).join('');
 const warning=cons.range<3?'Ти майже не розрізняв цікавість до напрямів; рейтинг має низьку роздільну здатність.':cons.percent<65?'Контрольні відповіді досить мінливі: результати краще розглядати як список для експериментів.':'Результати можна використовувати як первинну карту інтересів, але не як гарантію професійної придатності.';
 return `<section class="results"><div class="eyebrow">Підсумковий звіт · АТЛАС / 60</div><h1>Твій топ-10 напрямів розвитку</h1><p class="lead">Ми пройшли 60 дисциплін, обрали 24 найцікавіші та перевірили їх через реальні робочі витрати часу й вимушені вибори. <b>Відсоток — авторський індекс відповідності твоїм відповідям, не шанс успіху.</b></p>
 <div class="profile"><div class="tinycard"><h3>Профіль інтересів · RIASEC-подібна карта</h3>${profiles.map(x=>`<div class="meter"><div>${escapeHtml(x.label)}</div><div class="track"><div style="width:${x.v}%"></div></div><div class="value">${x.v}</div></div>`).join('')}<p class="fine">Ці 6 шкал розраховані за нашими оригінальними 60 пунктами; це не стандартизований результат O*NET.</p></div><div class="tinycard"><h3>Якість сигналу</h3><div style="font-size:49px;font-weight:800;color:var(--teal)">${cons.percent}%</div><p style="font-size:13px;color:var(--muted)">Узгодженість восьми повторних оцінок. Не показник чесності чи валідності тесту.</p><div class="pill">${cons.range}/5 використаних оцінок цікавості</div></div></div>
 <div class="callout"><strong>Інтерпретація.</strong> ${escapeHtml(warning)} Чітко розділяємо зацікавленість, терпимість до повсякденних задач та наявні навички. Деякі чудові для тебе напрями могли не пройти перший відбір 24 із 60 — тест не є остаточним вироком.</div>
 <div class="sep">РАНЖОВАНІ НАПРЯМИ</div><div style="margin-top:18px">${options}</div>
 <div class="divider"></div><h2>Бажане середовище</h2><p class="lead">Твої вибори між робочими режимами. Вони не підмішувалися до рейтингу галузей.</p><div class="chips">${selected.map(x=>`<span class="chip">${escapeHtml(x)}</span>`).join('')}</div>
 <div class="divider"></div><h2>Що робити з рейтингом?</h2><p class="lead">Спробуй три короткі практичні експерименти — по одному з перших трьох напрямів. Після кожного оціни, чи хотілося продовжувати, коли минула новизна. Саме поведінка у справі краще перевірить цей список.</p>
 <div class="controls">${actionButton('Завантажити повний результат (.json)','export')}${actionButton('Завантажити короткий звіт (.txt)','txt','secondary')}${actionButton('Друкувати / PDF','print','secondary')}${actionButton('Пройти заново','reset','secondary')}</div><p class="fine">Файл JSON містить відповіді та розраховані показники. Надішли його Гаммі в чат — і ми розберемо 10 напрямів глибше, без повторного анкетування. Дані залишаються на твоєму пристрої, доки ти сам не надішлеш файл.</p></section>`;
}
function results(){app.innerHTML=scoresMarkup()}
function render(){if(!isValid())state=blank();if(state.phase==='landing')landing();else if(state.phase==='chapter')chapter();else if(state.phase==='test')question();else results();}
function download(name,data,mime){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportJSON(){let data={assessment:'АТЛАС / 60 · Гамма',version:1,created:state.started,finished:state.finished,total_questions:132,topics:TOPICS.length,method:{main:'0.47×interest + 0.35×friction + 0.18×duel',readiness:'separate, not in rank',percentage:'index, not probability',reference:'RIASEC-like, not official or validated O*NET'},top10:computeScores().slice(0,10).map(x=>({...x,name:t(x.id).name})),profile:riasec(),consistency:consistency(),answers:state.answers,stageOrders:state.orders,preferences:VALUES.map((x,i)=>state.answers.values[String(i)]==='a'?x.tag[0]:x.tag[1])};download('atlas-gamma-results.json',JSON.stringify(data,null,2),'application/json;charset=utf-8')}
function exportText(){let top=computeScores().slice(0,10);let content=['АТЛАС / 60 — підсумковий звіт','Дата: '+new Date().toLocaleDateString('uk-UA'),'132 запитання · 60 напрямів','','Топ-10:'];top.forEach((x,i)=>content.push(`${i+1}. ${t(x.id).name} — ${x.score}% (зацікавленість ${x.interest}, рутина ${x.hard}, дилеми ${x.duel}; підготовка: ${x.readiness??'не оцінено'})`,`   Спробувати: ${t(x.id).trial}`));content.push('','RIASEC-подібний профіль: '+riasec().map(x=>x.label+' '+x.v).join(' | '),'Узгодженість контрольних відповідей: '+consistency().percent+'%','','Це авторський індекс, а не ймовірність успіху і не валідизована діагностика.');download('atlas-gamma-summary.txt',content.join('\n'),'text/plain;charset=utf-8')}
app.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c){choose(c.dataset.choice);return;}const btn=e.target.closest('[data-act]');if(!btn)return;let act=btn.dataset.act;if(act==='start')start();if(act==='resume')restore();if(act==='enter')enter();if(act==='back')previous();if(act==='print')window.print();if(act==='export')exportJSON();if(act==='txt')exportText();if(act==='reset'){if(confirm('Видалити поточний прогрес і пройти тест заново?')){state=blank();save();render()}}});
document.addEventListener('keydown',e=>{if(state.phase!=='test'||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Backspace'&&state.pos>0){e.preventDefault();previous();return}const st=stageLabel();if(['screen','friction','ready','retest'].includes(st.id)&&/^[1-5]$/.test(e.key)){choose(e.key)}else if(['duel','values'].includes(st.id)&&['1','2'].includes(e.key)){let opts=app.querySelectorAll('[data-choice]');if(opts[Number(e.key)-1])choose(opts[Number(e.key)-1].dataset.choice)}});
state=load();render();
</script>
</body>
</html>
